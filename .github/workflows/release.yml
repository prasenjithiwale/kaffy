# Builds kaffy for Linux (x86_64, arm64) and macOS when a v* tag is pushed, publishes the archives
# to the public folio site (github.com/prasenjithiwale/folio), which serves the
# install script, and updates the Homebrew formula in prasenjithiwale/homebrew-tap:
#
#   curl -fsSL https://prasenjithiwale.github.io/folio/kaffy/install.sh | sh
#   brew trust --formula prasenjithiwale/tap/kaffy && brew install prasenjithiwale/tap/kaffy
#
# Needs two secrets, each the private half of a write deploy key:
#   FOLIO_DEPLOY_KEY         on prasenjithiwale/folio
#   HOMEBREW_TAP_DEPLOY_KEY  on prasenjithiwale/homebrew-tap

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.4.0 (any ref for a dry run)"
        required: true
      dry_run:
        description: "Only build and check the binaries; publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  SITE: https://prasenjithiwale.github.io/folio/kaffy

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches the crate version
        if: ${{ !inputs.dry_run }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "kaffy") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Cargo version v$version"; exit 1
          fi

  licenses:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Collect third-party licenses
        run: |
          scripts/third-party-licenses.sh > THIRD-PARTY-LICENSES.txt
          grep -q '^librdkafka' THIRD-PARTY-LICENSES.txt
          grep -q '^Rust crates' THIRD-PARTY-LICENSES.txt
          wc -c THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.txt

  build:
    needs: [check, licenses]
    strategy:
      fail-fast: true
      matrix:
        include:
          # Static (musl) so one binary runs on any Linux, Alpine included; arm64 builds natively on the arm runner.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          # Cross-compiled on the Apple Silicon runner.
          - target: x86_64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build (static Linux, in Alpine)
        if: runner.os == 'Linux'
        # Alpine's Rust links musl statically. librdkafka includes <curl/curl.h> even
        # though it never links curl, hence curl-dev; zlib-static for the static link.
        run: |
          docker run --rm -v "$PWD":/src -w /src -e TARGET rust:1-alpine sh -euc '
            apk add --no-cache -q build-base cmake perl linux-headers curl-dev zlib-static
            cargo build --release --locked -p kaffy --target "$TARGET"
          '
          sudo chown -R "$(id -u):$(id -g)" target

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'macOS'
        with:
          key: ${{ matrix.target }}
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --locked -p kaffy --target "$TARGET"

      - name: Check the binary
        run: |
          bin="target/$TARGET/release/kaffy"
          file "$bin"
          case "$TARGET" in
            *linux-musl)
              file "$bin" | grep -Eq "static(ally|-pie) linked" \
                || { echo "::error::the Linux binary must be static"; exit 1; }
              "$bin" --version ;;
            *apple-darwin)
              otool -L "$bin"
              # Only the system's own libraries, which every Mac has.
              if otool -L "$bin" | tail -n +2 | grep -vE '^[[:space:]]+/(System/Library|usr/lib)/'; then
                echo "::error::the macOS binary links a non-system library"; exit 1
              fi
              if [ "$TARGET" = x86_64-apple-darwin ]; then
                arch -x86_64 "$bin" --version || echo "::warning::Rosetta unavailable; not run"
              else
                "$bin" --version
              fi ;;
          esac

      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
      - name: Package
        run: |
          name="kaffy-$TAG-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/kaffy" README.md config.example.toml LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          rm -r "dist/$name"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/

  publish:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency: folio-publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/checkout@v4
        with:
          repository: prasenjithiwale/folio
          ssh-key: ${{ secrets.FOLIO_DEPLOY_KEY }}
          path: folio

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/* --title "kaffy $TAG" --generate-notes \
              --verify-tag --repo "$REPO"
          fi

      - name: Add release to folio
        run: |
          releases=folio/kaffy/releases
          mkdir -p "$releases/$TAG"
          cp dist/* "$releases/$TAG/"
          printf '%s\n' "$TAG" > "$releases/latest.txt"
          assets='[]'
          for archive in dist/*.tar.gz; do
            file=$(basename "$archive")
            target=${file#kaffy-$TAG-}
            target=${target%.tar.gz}
            assets=$(jq --arg target "$target" --arg url "$TAG/$file" \
                        --arg sha256 "$(cut -d' ' -f1 "$archive.sha256")" \
                        --argjson size "$(stat -c %s "$archive")" \
              '. + [{target: $target, url: $url, size: $size, sha256: $sha256}]' <<<"$assets")
          done
          jq -n --arg tag "$TAG" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson assets "$assets" \
            '{version: $tag, published_at: $date, assets: $assets}' > "$releases/latest.json"
          cat "$releases/latest.json"

      - name: Push to folio
        working-directory: folio
        run: |
          git config user.name "kaffy release"
          git config user.email "kaffy-release@users.noreply.github.com"
          git add kaffy/releases
          git commit -m "kaffy $TAG"
          git push

  homebrew:
    needs: publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency: homebrew-tap-publish
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: kaffy
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/checkout@v4
        with:
          repository: prasenjithiwale/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Update Formula/kaffy.rb
        run: |
          mkdir -p tap/Formula
          kaffy/scripts/homebrew-formula.sh "$TAG" dist > tap/Formula/kaffy.rb
          cat tap/Formula/kaffy.rb

      - name: Push to homebrew-tap
        working-directory: tap
        run: |
          git config user.name "kaffy release"
          git config user.email "kaffy-release@users.noreply.github.com"
          git add Formula/kaffy.rb
          git commit -m "kaffy $TAG"
          # Other projects publish to this tap too; retry on a race.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

  smoke-test:
    # Installs exactly as a user would, once GitHub Pages serves the new release.
    needs: [publish, homebrew]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Wait for GitHub Pages
        run: |
          # Pages deploys usually take a minute but have stalled for hours; see docs/STATUS.md.
          for i in $(seq 1 120); do
            latest=$(curl -fsSL "$SITE/releases/latest.txt?nocache=$i" 2>/dev/null || true)
            if [ "$latest" = "$TAG" ]; then echo "Pages serves $TAG"; exit 0; fi
            sleep 10
          done
          echo "::error::Pages still serves '$latest' instead of $TAG"; exit 1

      - name: Install with sh
        run: |
          curl -fsSL "$SITE/install.sh" | sh
          "$HOME/.local/bin/kaffy" --version | tee /dev/stderr | grep -q "${TAG#v}"

      - name: Install on Debian 12 and Alpine
        if: runner.os == 'Linux'
        run: |
          docker run --rm -e TAG debian:12-slim bash -euc '
            apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
            curl -fsSL '"$SITE"'/install.sh | bash
            /root/.local/bin/kaffy --version | tee /dev/stderr | grep -q "${TAG#v}"
          '
          docker run --rm -e TAG alpine:3 sh -euc '
            wget -qO- '"$SITE"'/install.sh | sh
            /root/.local/bin/kaffy --version | tee /dev/stderr | grep -q "${TAG#v}"
          '

      - name: Install with Homebrew
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew trust --formula prasenjithiwale/tap/kaffy || true
          brew install prasenjithiwale/tap/kaffy
          kaffy --version | tee /dev/stderr | grep -q "${TAG#v}"
          brew test prasenjithiwale/tap/kaffy
