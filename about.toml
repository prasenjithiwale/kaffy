# cargo-about settings for THIRD-PARTY-LICENSES.txt (scripts/third-party-licenses.sh).
# Where a crate offers a choice of licenses, the first one listed here is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
]
# The release targets; dependencies for other platforms are left out.
targets = ["x86_64-unknown-linux-musl", "aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# kaffy's own crates.
private = { ignore = true }
