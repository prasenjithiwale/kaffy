[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
kaffy-config = { path = "crates/config" }
kaffy-kafka = { path = "crates/kafka" }
kaffy-schema = { path = "crates/schema" }
kaffy-ui = { path = "crates/ui" }

anyhow = "1"
apache-avro = "0.22"
arboard = "3.6"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
futures = "0.3"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "http2"] }
rdkafka = { version = "0.39", features = ["cmake-build", "ssl-vendored", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true

# Full debug info makes target/ grow by gigabytes on this workspace. Line
# tables keep panic backtraces readable; dependencies get none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
