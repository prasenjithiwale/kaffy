# kaffy config. Copy to ~/.config/kaffy/config.toml (or point $KAFFY_CONFIG / --config at it).

# Profile used when --profile is not given. Without it, the first profile (alphabetically) is used.
default_profile = "local"

# Colors: "dark", "light" or "terminal" (the terminal's own 16 colors). Left out, kaffy picks
# dark or light on terminals with true color and "terminal" elsewhere. --theme and $KAFFY_THEME
# override it.
# theme = "dark"

# Rebind keys: command = "key" or ["key", ...]. See "Rebinding keys" in the README.
# [keys]
# pause = "p"
# produce = "P"

[profiles.local]
bootstrap_servers = "localhost:9092"
# read_only defaults to true: write operations stay disabled until you opt in.
read_only = false

[profiles.staging]
bootstrap_servers = "broker-1.staging:9094,broker-2.staging:9094"
security_protocol = "sasl_ssl"          # plaintext | ssl | sasl_plaintext | sasl_ssl
sasl = { mechanism = "SCRAM-SHA-512", username = "svc-kaffy", password_env = "KAFFY_STAGING_PASSWORD" }
tls = { ca_location = "/etc/ssl/certs/staging-ca.pem" }
schema_registry = { url = "https://schema-registry.staging:8081", username = "sr-key", password_env = "KAFFY_STAGING_SR_SECRET" }
# Show only your team's topics and groups: globs (* and ?), a leading ! excludes. --topics / --groups
# override them for one run. This narrows the view; it is not access control (use Kafka ACLs for that).
topics = ["checkout-*", "payments", "!*.dlq"]
groups = ["checkout-*"]

[profiles.prod-mtls]
bootstrap_servers = "broker-1.prod:9093"
security_protocol = "ssl"
prod = true                              # shows a PROD badge; destructive ops will need typed confirmation
tls = { ca_location = "/etc/kaffy/ca.pem", certificate_location = "/etc/kaffy/client.pem", key_location = "/etc/kaffy/client.key" }

# Confluent Cloud: an API key and secret over SASL/PLAIN; the registry has its own key.
[profiles.confluent]
bootstrap_servers = "pkc-xxxxx.eu-west-1.aws.confluent.cloud:9092"
security_protocol = "sasl_ssl"
sasl = { mechanism = "PLAIN", username = "<cluster API key>", password_env = "KAFFY_CC_SECRET" }
schema_registry = { url = "https://psrc-xxxxx.eu-west-1.aws.confluent.cloud", username = "<registry API key>", password_env = "KAFFY_CC_SR_SECRET" }

# Amazon MSK with IAM access control (the IAM listener, port 9098). Credentials come from the
# AWS profile (SSO and assumed roles work through the AWS CLI) or the AWS_* environment variables.
[profiles.msk]
bootstrap_servers = "b-1.mycluster.abc123.c2.kafka.eu-west-1.amazonaws.com:9098"
security_protocol = "sasl_ssl"
aws_msk_iam = { region = "eu-west-1", profile = "msk-dev" }

# Any librdkafka property can be set directly and overrides the settings above.
[profiles.prod-mtls.librdkafka]
"socket.timeout.ms" = "10000"
"client.rack" = "eu-west-1a"

# Topics whose messages are plain Protobuf (no Schema Registry). Paths are relative to this file.
[[profiles.local.protobuf]]
topic = "orders-proto"
files = ["proto/orders.proto"]
include = ["proto"]
value = "acme.Order"
# key = "acme.OrderKey"
